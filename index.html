<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>مول الخبز - الإدارة والفواتير</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Tahoma', 'Arial', sans-serif;
            background: linear-gradient(135deg, #1a472a, #2d6a4f);
            min-height: 100vh;
            padding: 10px;
        }
        .app-container {
            max-width: 450px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .header {
            background: #2d6a4f;
            color: white;
            padding: 15px 20px;
            text-align: center;
        }
        .header h1 { font-size: 20px; margin-bottom: 3px; }
        .header p { font-size: 11px; opacity: 0.8; }

        /* فلتر */
        .filter-buttons {
            display: flex;
            gap: 6px;
            margin: 10px 12px 0 12px;
        }
        .filter-btn {
            flex: 1;
            background: #e9ecef;
            color: #2d6a4f;
            border: none;
            padding: 8px 5px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            text-align: center;
        }
        .filter-btn.active {
            background: #2d6a4f;
            color: white;
        }

        .schedule-btn {
            background: #e67e22;
            color: white;
            border: none;
            padding: 10px;
            margin: 10px 12px 0 12px;
            width: calc(100% - 24px);
            border-radius: 10px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }
        
        /* ===== تصميم خانة إضافة الزبون (مصغرة) ===== */
        .add-section {
            background: #f8f9fa;
            margin: 10px 12px;
            padding: 10px 12px;
            border-radius: 12px;
        }
        .add-section h4 { 
            color: #2d6a4f; 
            margin-bottom: 8px; 
            font-size: 13px; 
            font-weight: bold;
        }
        .input-row { 
            display: flex; 
            gap: 8px; 
            align-items: center;
        }
        .input-row input {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 13px;
            height: 38px;
        }
        .input-row input:focus {
            outline: none;
            border-color: #2d6a4f;
        }
        .input-row button {
            background: #2d6a4f;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            height: 38px;
            white-space: nowrap;
        }
        .input-row button:hover {
            background: #1a472a;
        }

        /* ===== باقي العناصر ===== */
        .search-section {
            background: #f8f9fa;
            margin: 10px 12px;
            padding: 10px 12px;
            border-radius: 12px;
        }
        .search-section h4 { 
            color: #2d6a4f; 
            margin-bottom: 6px; 
            font-size: 13px;
            font-weight: bold;
        }
        .search-section input {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 13px;
            height: 38px;
        }
        .search-section input:focus {
            outline: none;
            border-color: #2d6a4f;
        }

        .phone-banner {
            background: #f4a261;
            color: #1a472a;
            text-align: center;
            padding: 10px;
            margin: 10px 12px 0 12px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: bold;
        }
        .phone-banner span {
            font-size: 18px;
            background: white;
            padding: 2px 12px;
            border-radius: 30px;
            display: inline-block;
            margin-top: 3px;
        }
        .total-card {
            background: #f4a261;
            color: white;
            text-align: center;
            padding: 15px;
            margin: 10px 12px;
            border-radius: 12px;
        }
        .total-card h3 { font-size: 14px; margin-bottom: 5px; font-weight: normal; }
        .total-card .total-value { font-size: 34px; font-weight: bold; }
        
        .customers-list { margin: 10px 12px; max-height: 400px; overflow-y: auto; }
        
        .customer-card {
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 10px;
        }
        .customer-card.hidden { display: none; }
        .customer-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            flex-wrap: wrap;
            gap: 5px;
        }
        .customer-name { font-size: 16px; font-weight: bold; color: #2d6a4f; }
        .customer-total {
            background: #e9ecef;
            padding: 3px 10px;
            border-radius: 20px;
            font-weight: bold;
            color: #2d6a4f;
            font-size: 12px;
        }
        .customer-status {
            background: #e9ecef;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 11px;
            cursor: pointer;
        }
        .customer-status.paid { background: #2d6a4f; color: white; }
        .customer-status.unpaid { background: #e63946; color: white; }
        
        .payment-row { display: flex; gap: 8px; margin-bottom: 8px; }
        .payment-row input {
            flex: 1;
            padding: 6px 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            text-align: center;
            font-size: 13px;
            height: 34px;
        }
        .payment-row button {
            background: #f4a261;
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
            height: 34px;
        }
        .payments-log {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 8px;
            margin-bottom: 8px;
            max-height: 100px;
            overflow-y: auto;
        }
        .payment-log-item {
            display: flex;
            justify-content: space-between;
            padding: 4px 6px;
            border-bottom: 1px solid #e9ecef;
            font-size: 12px;
        }
        .payment-log-item .time { color: #6c757d; }
        .payment-log-item .amount { font-weight: bold; color: #2d6a4f; }
        .empty-log { text-align: center; color: #adb5bd; font-size: 11px; padding: 5px; }
        
        .customer-buttons { display: flex; gap: 8px; }
        .invoice-btn {
            flex: 1;
            background: #1e6091;
            color: white;
            border: none;
            padding: 8px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
        }
        .delete-customer-btn {
            flex: 1;
            background: #e63946;
            color: white;
            border: none;
            padding: 8px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
        }
        
        .day-buttons { display: flex; gap: 8px; margin: 10px 12px; }
        .new-day-btn {
            background: #e63946;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            flex: 1;
        }
        
        .footer {
            background: #1a472a;
            color: white;
            text-align: center;
            padding: 12px;
            font-size: 11px;
        }
        .footer .phone { font-size: 15px; font-weight: bold; margin-top: 3px; }
        
        /* ===== تنبيه ===== */
        .alert {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #2d6a4f;
            color: white;
            padding: 10px 20px;
            border-radius: 30px;
            z-index: 1000;
            font-size: 13px;
            animation: slideDown 0.3s ease;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }
        @keyframes slideDown {
            from { top: -50px; opacity: 0; }
            to { top: 20px; opacity: 1; }
        }
        
        /* ===== المودال ===== */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
        }
        .modal-content {
            background: white;
            max-width: 450px;
            width: 100%;
            max-height: 90%;
            overflow-y: auto;
            border-radius: 20px;
            padding: 20px;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #2d6a4f;
        }
        .modal-header h3 { color: #2d6a4f; font-size: 18px; }
        .close-modal {
            background: #e63946;
            color: white;
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            font-size: 16px;
            cursor: pointer;
        }
        .schedule-form {
            background: #f8f9fa;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 15px;
        }
        .schedule-form input {
            width: 100%;
            padding: 8px 12px;
            margin-bottom: 8px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 13px;
            height: 38px;
        }
        .schedule-form button {
            background: #2d6a4f;
            color: white;
            border: none;
            padding: 10px;
            width: 100%;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }
        .schedule-item {
            background: #e9ecef;
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 5px;
        }
        .schedule-info { flex: 1; }
        .schedule-name { font-weight: bold; color: #2d6a4f; font-size: 14px; }
        .schedule-details { font-size: 12px; color: #555; }
        .schedule-actions button {
            background: #e63946;
            color: white;
            border: none;
            padding: 4px 12px;
            border-radius: 8px;
            cursor: pointer;
        }
        .clear-schedule-btn {
            background: #e67e22;
            color: white;
            border: none;
            padding: 10px;
            width: 100%;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 12px;
            font-weight: bold;
        }

        /* ===== تنسيق الفاتورة للطباعة - أبيض وأسود بسيط ===== */
        @media print {
            body * { visibility: hidden; }
            .print-area, .print-area * { visibility: visible; }
            .print-area { position: absolute; top: 0; right: 0; width: 100%; background: white; }
        }

        /* تحسين للشاشات الصغيرة جداً */
        @media (max-width: 380px) {
            .filter-btn { font-size: 10px; padding: 6px 3px; }
            .customer-name { font-size: 14px; }
            .input-row input { font-size: 12px; height: 34px; }
            .input-row button { font-size: 12px; height: 34px; padding: 6px 12px; }
            .total-card .total-value { font-size: 28px; }
        }
    </style>
</head>
<body>
    <div id="mainApp"></div>
    <script>
        (function(){
            // ==================== المؤثرات الصوتية (محسنة) ====================
            function playSound(type) {
                try {
                    // محاولة استخدام Web Audio API (يعمل على جميع المتصفحات الحديثة)
                    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    
                    // إذا كان الصوت مكتوماً، نفتحه
                    if (audioCtx.state === 'suspended') {
                        audioCtx.resume();
                    }
                    
                    const oscillator = audioCtx.createOscillator();
                    const gainNode = audioCtx.createGain();
                    
                    oscillator.connect(gainNode);
                    gainNode.connect(audioCtx.destination);
                    
                    let frequency = 440;
                    let duration = 0.15;
                    let volume = 0.2;
                    
                    switch(type) {
                        case 'success':
                            frequency = 523;
                            duration = 0.2;
                            break;
                        case 'error':
                            frequency = 200;
                            duration = 0.3;
                            volume = 0.15;
                            break;
                        case 'coin':
                            frequency = 800;
                            duration = 0.1;
                            oscillator.frequency.setValueAtTime(600, audioCtx.currentTime);
                            oscillator.frequency.linearRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
                            break;
                        case 'print':
                            for(let i = 0; i < 4; i++) {
                                setTimeout(() => {
                                    try {
                                        const ctx = new (window.AudioContext || window.webkitAudioContext)();
                                        const osc = ctx.createOscillator();
                                        const gain = ctx.createGain();
                                        osc.connect(gain);
                                        gain.connect(ctx.destination);
                                        osc.frequency.value = 800 + Math.random() * 300;
                                        gain.gain.value = 0.08;
                                        osc.start(ctx.currentTime);
                                        osc.stop(ctx.currentTime + 0.03);
                                    } catch(e) {}
                                }, i * 50);
                            }
                            return;
                        case 'delete':
                            frequency = 300;
                            duration = 0.25;
                            oscillator.frequency.setValueAtTime(300, audioCtx.currentTime);
                            oscillator.frequency.linearRampToValueAtTime(100, audioCtx.currentTime + 0.25);
                            break;
                        case 'reminder':
                            for(let i = 0; i < 3; i++) {
                                setTimeout(() => {
                                    try {
                                        const ctx = new (window.AudioContext || window.webkitAudioContext)();
                                        const osc = ctx.createOscillator();
                                        const gain = ctx.createGain();
                                        osc.connect(gain);
                                        gain.connect(ctx.destination);
                                        osc.frequency.value = 880;
                                        gain.gain.value = 0.12;
                                        osc.start(ctx.currentTime);
                                        osc.stop(ctx.currentTime + 0.08);
                                    } catch(e) {}
                                }, i * 200);
                            }
                            return;
                        case 'newday':
                            [523, 587, 659, 784].forEach((freq, i) => {
                                setTimeout(() => {
                                    try {
                                        const ctx = new (window.AudioContext || window.webkitAudioContext)();
                                        const osc = ctx.createOscillator();
                                        const gain = ctx.createGain();
                                        osc.connect(gain);
                                        gain.connect(ctx.destination);
                                        osc.frequency.value = freq;
                                        gain.gain.value = 0.12;
                                        osc.start(ctx.currentTime);
                                        osc.stop(ctx.currentTime + 0.12);
                                    } catch(e) {}
                                }, i * 120);
                            });
                            return;
                        default:
                            frequency = 440;
                            duration = 0.1;
                    }
                    
                    oscillator.frequency.value = frequency;
                    oscillator.type = 'sine';
                    gainNode.gain.value = volume;
                    
                    oscillator.start(audioCtx.currentTime);
                    oscillator.stop(audioCtx.currentTime + duration);
                    
                } catch(e) {
                    // إذا فشل الصوت، نتجاهل الخطأ (لا نعرض رسالة)
                    console.log('Sound not supported');
                }
            }

            // ==================== البيانات الأساسية ====================
            let customers = [];
            let dailySchedule = [];
            let currentFilter = 'all';

            // ==================== دوال مساعدة ====================
            function showAlert(msg) {
                let div = document.createElement('div');
                div.className = 'alert';
                div.textContent = msg;
                document.body.appendChild(div);
                setTimeout(() => div.remove(), 2500);
            }
            function escapeHtml(t) {
                let d = document.createElement('div');
                d.textContent = t;
                return d.innerHTML;
            }

            // ==================== حفظ وتحميل البيانات ====================
            function saveData() { localStorage.setItem('moulBreadData', JSON.stringify(customers)); }
            function loadData() {
                let saved = localStorage.getItem('moulBreadData');
                if(saved) { try{ customers = JSON.parse(saved); } catch(e){ customers = []; } }
                customers.forEach(c => { if(c.isPaid === undefined) c.isPaid = false; });
            }
            function saveSchedule() { localStorage.setItem('dailySchedule', JSON.stringify(dailySchedule)); }
            function loadSchedule() {
                let saved = localStorage.getItem('dailySchedule');
                if(saved) { try{ dailySchedule = JSON.parse(saved); } catch(e){ dailySchedule = []; } }
            }

            // ==================== الفلتر ====================
            function setFilter(filter) {
                currentFilter = filter;
                document.querySelectorAll('.filter-btn').forEach(btn => {
                    if(btn.getAttribute('data-filter') === filter) btn.classList.add('active');
                    else btn.classList.remove('active');
                });
                applyFilter();
            }
            function applyFilter() {
                let cards = document.querySelectorAll('.customer-card');
                cards.forEach(card => {
                    let status = card.getAttribute('data-status');
                    if(currentFilter === 'all') card.classList.remove('hidden');
                    else if(currentFilter === 'paid' && status === 'paid') card.classList.remove('hidden');
                    else if(currentFilter === 'unpaid' && status === 'unpaid') card.classList.remove('hidden');
                    else card.classList.add('hidden');
                });
            }
            function togglePaidStatus(customerId) {
                let customer = customers.find(c => c.id == customerId);
                if(customer) {
                    customer.isPaid = !customer.isPaid;
                    saveData();
                    updateDisplay();
                    if (customer.isPaid) {
                        playSound('success');
                        showAlert(`✅ ${customer.name} خالص`);
                    } else {
                        playSound('error');
                        showAlert(`⚠️ ${customer.name} غير خالص`);
                    }
                }
            }

            // ==================== الفاتورة والطباعة ====================
            function printInvoice(customerId) {
                let customer = customers.find(c => c.id == customerId);
                if(!customer) return;
                
                playSound('print');
                
                let total = customer.payments.reduce((s,p) => s + p.amount, 0);
                let paymentsHtml = '';
                if(customer.payments.length > 0) {
                    let reversed = [...customer.payments].reverse();
                    for(let p of reversed) {
                        paymentsHtml += `<tr><td style="border:1px solid #000;padding:5px 8px;text-align:center;font-weight:300;">${p.time}</td><td style="border:1px solid #000;padding:5px 8px;text-align:center;font-weight:300;">${p.amount} وحدة</td></tr>`;
                    }
                } else {
                    paymentsHtml = '<tr><td colspan="2" style="border:1px solid #000;padding:5px 8px;text-align:center;font-weight:300;">لا توجد طلبات</td></tr>';
                }
                
                let today = new Date();
                let dateStr = today.toLocaleDateString('ar', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
                
                let printWindow = window.open('', '_blank');
                printWindow.document.write(`
                    <!DOCTYPE html>
                    <html dir="rtl">
                    <head>
                        <meta charset="UTF-8">
                        <title>فاتورة ${escapeHtml(customer.name)}</title>
                        <style>
                            body { font-family: 'Tahoma', 'Arial', sans-serif; padding: 20px; background: white; color: black; }
                            .invoice { max-width: 380px; margin: 0 auto; border: 1px solid #000; padding: 18px 15px; }
                            .header { text-align: center; border-bottom: 2px solid #000; padding-bottom: 10px; margin-bottom: 12px; }
                            .header h1 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: 1px; }
                            .header p { font-size: 11px; margin: 2px 0; font-weight: 300; }
                            .date { text-align: center; font-size: 13px; font-weight: 300; margin-bottom: 8px; color: #333; }
                            .customer-name { font-size: 24px; font-weight: 400; text-align: center; margin: 8px 0 14px 0; letter-spacing: 0.5px; }
                            table { width: 100%; border-collapse: collapse; margin: 10px 0; }
                            th { border: 1px solid #000; padding: 5px 8px; text-align: center; font-weight: 400; background: #f5f5f5; }
                            td { border: 1px solid #000; padding: 5px 8px; text-align: center; font-weight: 300; }
                            .total { font-size: 18px; font-weight: 400; text-align: center; margin-top: 12px; padding-top: 8px; border-top: 2px solid #000; letter-spacing: 0.5px; }
                            .footer { text-align: center; margin-top: 16px; font-size: 13px; border-top: 1px solid #000; padding-top: 10px; }
                            .footer .phone { font-size: 20px; font-weight: 300; letter-spacing: 1px; }
                            .print-btn { display: block; margin: 15px auto; padding: 8px 20px; background: #111; color: white; border: 1px solid #000; border-radius: 6px; cursor: pointer; font-weight: 300; font-size: 14px; }
                            @media print { .print-btn { display: none; } }
                        </style>
                    </head>
                    <body>
                        <div class="invoice">
                            <div class="header">
                                <h1>🍞 مول الخبز</h1>
                            </div>
                            <div class="date">${dateStr}</div>
                            <div class="customer-name">${escapeHtml(customer.name)}</div>
                            <table>
                                <thead>
                                    <tr><th>الوقت</th><th>الكمية</th></tr>
                                </thead>
                                <tbody>${paymentsHtml}</tbody>
                            </table>
                            <div class="total">الإجمالي: ${total} وحدة</div>
                            <div class="footer">
                                <div class="phone">0605062609</div>
                            </div>
                        </div>
                        <button class="print-btn" onclick="window.print(); setTimeout(()=>window.close(), 600);">🖨️ طباعة الفاتورة</button>
                    </body>
                    </html>
                `);
                printWindow.document.close();
            }

            // ==================== البرنامج اليومي ====================
            function showScheduleModal() {
                let existing = document.getElementById('scheduleModal');
                if(existing) existing.remove();
                let scheduleHtml = dailySchedule.length === 0 ? '<div style="text-align:center;padding:15px;color:#adb5bd;">📋 لا توجد مواعيد مضافة</div>' :
                    dailySchedule.map(s => `<div class="schedule-item"><div class="schedule-info"><div class="schedule-name">${escapeHtml(s.name)}</div><div class="schedule-details">🍞 ${s.amount} وحدة | ⏰ ${s.time}</div></div><div class="schedule-actions"><button onclick="window.deleteFromSchedule(${s.id})">🗑️</button></div></div>`).join('');
                let modal = document.createElement('div');
                modal.id = 'scheduleModal';
                modal.className = 'modal';
                modal.innerHTML = `<div class="modal-content"><div class="modal-header"><h3>📋 البرنامج اليومي</h3><button class="close-modal" onclick="this.closest('.modal').remove()">✖</button></div>
                    <div class="schedule-form"><input type="text" id="scheduleName" placeholder="اسم الزبون"><input type="number" id="scheduleAmount" placeholder="عدد الخبز اليومي"><input type="time" id="scheduleTime" placeholder="الساعة">
                    <button onclick="window.addToSchedule()">➕ إضافة موعد</button></div>
                    <div id="scheduleList">${scheduleHtml}</div>
                    <button class="clear-schedule-btn" onclick="window.clearAllSchedule()">🗑️ مسح البرنامج اليومي بالكامل</button></div>`;
                document.body.appendChild(modal);
            }
            function addToSchedule() {
                let name = document.getElementById('scheduleName')?.value.trim();
                let amount = document.getElementById('scheduleAmount')?.value;
                let time = document.getElementById('scheduleTime')?.value;
                if(!name) { showAlert('الرجاء إدخال اسم الزبون'); return; }
                if(!amount || amount<=0) { showAlert('الرجاء إدخال عدد صحيح'); return; }
                if(!time) { showAlert('الرجاء إدخال الساعة'); return; }
                dailySchedule.push({ id: Date.now(), name: name, amount: parseInt(amount), time: time });
                saveSchedule();
                showScheduleModal();
                playSound('success');
                showAlert(`✅ تم إضافة ${name}`);
            }
            function deleteFromSchedule(id) {
                dailySchedule = dailySchedule.filter(s => s.id != id);
                saveSchedule();
                showScheduleModal();
                playSound('delete');
                showAlert('🗑️ تم الحذف');
            }
            function clearAllSchedule() {
                if(dailySchedule.length===0) { showAlert('لا توجد بيانات'); return; }
                if(confirm('⚠️ مسح كل البرنامج اليومي؟')) { dailySchedule = []; saveSchedule(); showScheduleModal(); playSound('delete'); showAlert('✅ تم المسح'); }
            }
            function requestNotifPermission() {
                if(!("Notification" in window)) { showAlert("المتصفح لا يدعم الإشعارات"); return; }
                Notification.requestPermission().then(perm => { if(perm==='granted') showAlert("🔔 تم تفعيل الإشعارات"); });
            }
            function checkReminders() {
                let now = new Date();
                let currentHour = now.getHours();
                let currentMinute = now.getMinutes();
                dailySchedule.forEach(item => {
                    let [schHour, schMinute] = item.time.split(':').map(Number);
                    let diff = (schHour*60+schMinute) - (currentHour*60+currentMinute);
                    if(diff>=0 && diff<=5) {
                        let lastNotif = localStorage.getItem(`reminder_${item.id}_${now.toDateString()}`);
                        if(!lastNotif) {
                            localStorage.setItem(`reminder_${item.id}_${now.toDateString()}`, 'sent');
                            playSound('reminder');
                            if(Notification.permission==='granted') new Notification(`🔔 تذكير: ${item.name}`, { body: `${item.amount} وحدة - ${item.time}` });
                            showAlert(`🔔 تذكير: ${item.name} - ${item.amount} وحدة الساعة ${item.time}`);
                        }
                    }
                });
            }

            // ==================== دوال الإدارة ====================
            function addCustomer() {
                let input = document.getElementById('customerName');
                let name = input.value.trim();
                if(!name) { showAlert('الرجاء إدخال اسم الزبون'); return; }
                if(customers.some(c=>c.name===name)) { showAlert('الزبون موجود بالفعل'); return; }
                customers.push({ id: Date.now(), name: name, payments: [], isPaid: false });
                input.value = '';
                saveData();
                updateDisplay();
                playSound('success');
                showAlert(`تم إضافة ${name} ✅`);
            }
            function addPayment(cid) {
                let input = document.querySelector(`[data-payment-input="${cid}"]`);
                if(!input) return;
                let amount = parseInt(input.value);
                if(!amount || amount<=0) { showAlert('أدخل عدد الوحدات'); return; }
                let cust = customers.find(c=>c.id==cid);
                if(!cust) return;
                let now = new Date();
                let timeStr = `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;
                cust.payments.push({ amount: amount, time: timeStr });
                input.value = '';
                saveData();
                updateDisplay();
                playSound('coin');
                showAlert(`تم إضافة ${amount} وحدة ✅`);
            }
            function deleteCustomer(cid) {
                let cust = customers.find(c=>c.id==cid);
                if(!cust) return;
                if(confirm(`حذف ${cust.name}؟`)) {
                    customers = customers.filter(c=>c.id!=cid);
                    saveData();
                    updateDisplay();
                    playSound('delete');
                    showAlert(`تم حذف ${cust.name} 🗑️`);
                }
            }
            function startNewDay() {
                if(customers.length===0) { showAlert('لا توجد بيانات'); return; }
                let total = customers.reduce((s,c)=>s+c.payments.reduce((s2,p)=>s2+p.amount,0),0);
                if(confirm(`المجموع: ${total} وحدة\n${customers.length} زبون\nبدء يوم جديد؟`)) {
                    customers = [];
                    saveData();
                    updateDisplay();
                    playSound('newday');
                    showAlert('تم بدء يوم جديد 🎉');
                }
            }
            function searchCustomers() {
                let inp = document.getElementById('searchInput');
                if(!inp) return;
                let txt = inp.value.trim().toLowerCase();
                document.querySelectorAll('.customer-card').forEach(card=>{
                    let name = card.querySelector('.customer-name')?.textContent.toLowerCase()||'';
                    if(txt==='' || name.includes(txt)) card.classList.remove('hidden');
                    else card.classList.add('hidden');
                });
                applyFilter();
            }

            // ==================== صفحة الزبون ====================
            function showCustomerView(customerName) {
                let customer = customers.find(c => c.name === customerName);
                if (!customer) {
                    return `<!DOCTYPE html>
                    <html lang="ar" dir="rtl">
                    <head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>الزبون غير موجود</title>
                    <style>body{font-family:'Tahoma';background:#1a472a;padding:20px;text-align:center;} .card{background:white;max-width:400px;margin:0 auto;border-radius:20px;padding:40px;}</style>
                    </head><body><div class="card"><h2>⚠️ لا يوجد زبون بهذا الاسم</h2><p>الرجاء التأكد من الرابط أو التواصل مع المدير</p></div></body></html>`;
                }
                let customerTotal = customer.payments.reduce((s, p) => s + p.amount, 0);
                let paymentsHtml = '';
                if (customer.payments.length > 0) {
                    let reversed = [...customer.payments].reverse();
                    for (let p of reversed) {
                        paymentsHtml += `<div class="payment-log-item"><span class="time">⏰ ${p.time}</span><span class="amount">🍞 ${p.amount} وحدة</span></div>`;
                    }
                } else {
                    paymentsHtml = '<div class="empty-log" style="text-align:center;padding:20px;color:#adb5bd;">لا توجد طلبات بعد</div>';
                }
                return `<!DOCTYPE html>
                <html lang="ar" dir="rtl">
                <head>
                    <meta charset="UTF-8">
                    <meta name="viewport" content="width=device-width, initial-scale=1.0">
                    <title>سجل ${escapeHtml(customer.name)}</title>
                    <style>
                        *{margin:0;padding:0;box-sizing:border-box;}
                        body{font-family:'Tahoma','Arial',sans-serif;background:linear-gradient(135deg,#1a472a,#2d6a4f);min-height:100vh;padding:15px;}
                        .customer-view-page{max-width:450px;margin:0 auto;background:white;border-radius:20px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,0.2);}
                        .header{background:#2d6a4f;color:white;padding:20px;text-align:center;}
                        .header h1{font-size:22px;margin-bottom:5px;}
                        .header p{font-size:12px;opacity:0.8;}
                        .customer-view-card{background:white;margin:15px;padding:20px;border-radius:15px;text-align:center;}
                        .customer-view-name{font-size:28px;color:#2d6a4f;margin-bottom:20px;}
                        .customer-view-total{background:#f4a261;color:white;padding:15px;border-radius:15px;margin-bottom:20px;}
                        .customer-view-total span{font-size:36px;font-weight:bold;}
                        .payments-log{background:#f8f9fa;border-radius:10px;padding:10px;margin-bottom:20px;max-height:300px;overflow-y:auto;}
                        .payment-log-item{display:flex;justify-content:space-between;padding:6px 8px;border-bottom:1px solid #e9ecef;font-size:13px;}
                        .payment-log-item .time{color:#6c757d;}
                        .payment-log-item .amount{font-weight:bold;color:#2d6a4f;}
                        .empty-log{text-align:center;color:#adb5bd;font-size:12px;padding:8px;}
                        .footer{background:#1a472a;color:white;text-align:center;padding:15px;font-size:12px;}
                        .footer .phone{font-size:16px;font-weight:bold;margin-top:5px;}
                    </style>
                </head>
                <body>
                    <div class="customer-view-page">
                        <div class="header"><h1>🍞 مول الخبز</h1><p>سجل الخبز الخاص بك</p></div>
                        <div class="customer-view-card">
                            <div class="customer-view-name">${escapeHtml(customer.name)}</div>
                            <div class="customer-view-total"><div>📊 إجمالي الوحدات</div><span>${customerTotal}</span><div>وحدة</div></div>
                            <div class="payments-log">${paymentsHtml}</div>
                        </div>
                        <div class="footer">📞 للتواصل من أجل الإعلانات<div class="phone">0605062609</div></div>
                    </div>
                </body>
                </html>`;
            }

            // ==================== عرض واجهة الإدارة ====================
            function updateDisplay() {
                let total = customers.reduce((s,c)=>s+c.payments.reduce((s2,p)=>s2+p.amount,0),0);
                let totalEl = document.getElementById('totalBread');
                if(totalEl) totalEl.textContent = total;
                let container = document.getElementById('customersList');
                if(!container) return;
                if(customers.length===0) {
                    container.innerHTML = '<div style="text-align:center;padding:30px;color:#adb5bd;">👥 لا يوجد زبناء<br><span style="font-size:11px;">أضف زبونك الأول</span></div>';
                    return;
                }
                let html = '';
                for(let c of customers) {
                    let custTotal = c.payments.reduce((s,p)=>s+p.amount,0);
                    let logs = '';
                    if(c.payments.length) {
                        let rev = [...c.payments].reverse();
                        for(let p of rev) logs += `<div class="payment-log-item"><span class="time">⏰ ${p.time}</span><span class="amount">🍞 ${p.amount} وحدة</span></div>`;
                    } else { logs = '<div class="empty-log">لا توجد طلبات بعد</div>'; }
                    html += `<div class="customer-card" data-status="${c.isPaid ? 'paid' : 'unpaid'}">
                        <div class="customer-row">
                            <div style="display: flex; gap: 6px; align-items: center; flex-wrap: wrap;">
                                <span class="customer-name">${escapeHtml(c.name)}</span>
                                <span class="customer-total">${custTotal} وحدة</span>
                            </div>
                            <span class="customer-status ${c.isPaid ? 'paid' : 'unpaid'}" onclick="togglePaidStatus(${c.id})">${c.isPaid ? '✅ خالص' : '⚠️ غير خالص'}</span>
                        </div>
                        <div class="payment-row"><input type="number" data-payment-input="${c.id}" placeholder="عدد الوحدات" onkeypress="if(event.key=='Enter') addPayment(${c.id})"><button onclick="addPayment(${c.id})">➕ إضافة</button></div>
                        <div class="payments-log">${logs}</div>
                        <div class="customer-buttons">
                            <button class="invoice-btn" onclick="printInvoice(${c.id})">🧾 فاتورة</button>
                            <button class="delete-customer-btn" onclick="deleteCustomer(${c.id})">🗑️ حذف الزبون</button>
                        </div>
                    </div>`;
                }
                container.innerHTML = html;
                searchCustomers();
                applyFilter();
            }

            function showMainApp() {
                let html = `<div class="app-container">
                    <div class="header"><h1>🍞 مول الخبز</h1><p>تطبيق إدارة وتوزيع الخبز الذكي</p></div>
                    <div class="filter-buttons">
                        <button class="filter-btn active" data-filter="all" onclick="setFilter('all')">📋 كل الزبائن</button>
                        <button class="filter-btn" data-filter="paid" onclick="setFilter('paid')">✅ خالص</button>
                        <button class="filter-btn" data-filter="unpaid" onclick="setFilter('unpaid')">⚠️ غير خالص</button>
                    </div>
                    <button class="schedule-btn" onclick="requestNotifPermission(); showScheduleModal();">📋 البرنامج اليومي (مواعيد ثابتة)</button>
                    <div class="phone-banner">📞 عبدالرزاق <span>0605062609</span></div>
                    <div class="total-card"><h3>📊 إجمالي الوحدات الموزعة اليوم</h3><div class="total-value" id="totalBread">0</div><p style="font-size:11px;margin-top:3px;">وحدة</p></div>
                    
                    <!-- خانة إضافة الزبون (مصغرة) -->
                    <div class="add-section"><h4>➕ إضافة زبون جديد</h4><div class="input-row"><input type="text" id="customerName" placeholder="اسم الزبون" style="flex:1;"><button id="addCustomerBtn" style="flex-shrink:0;">إضافة</button></div></div>
                    
                    <div class="search-section"><h4>🔍 بحث عن زبون</h4><input type="text" id="searchInput" placeholder="اكتب اسم الزبون..." onkeyup="searchCustomers()"></div>
                    <div class="customers-list" id="customersList"></div>
                    <div class="day-buttons"><button class="new-day-btn" id="newDayBtn">🔄 بدء يوم جديد (مسح التوزيع فقط)</button></div>
                    <div class="footer">📞 للتواصل من أجل الإعلانات<div class="phone">0605062609</div></div>
                </div>`;
                document.getElementById('mainApp').innerHTML = html;
                document.getElementById('addCustomerBtn').onclick = addCustomer;
                document.getElementById('customerName').onkeypress = e => { if(e.key==='Enter') addCustomer(); };
                document.getElementById('newDayBtn').onclick = startNewDay;
                updateDisplay();
            }

            // ==================== ربط الدوال للنافذة ====================
            window.addPayment = addPayment;
            window.deleteCustomer = deleteCustomer;
            window.searchCustomers = searchCustomers;
            window.showScheduleModal = showScheduleModal;
            window.addToSchedule = addToSchedule;
            window.deleteFromSchedule = deleteFromSchedule;
            window.clearAllSchedule = clearAllSchedule;
            window.requestNotifPermission = requestNotifPermission;
            window.printInvoice = printInvoice;
            window.togglePaidStatus = togglePaidStatus;
            window.setFilter = setFilter;

            // ==================== بدء التشغيل ====================
            loadData();
            loadSchedule();
            setInterval(checkReminders, 60000);
            checkReminders();
            
            let urlParams = new URLSearchParams(window.location.search);
            let customerParam = urlParams.get('customer');
            if(customerParam) {
                document.write(showCustomerView(customerParam));
                document.close();
            } else {
                showMainApp();
            }
        })();
    </script>
</body>
</html>
