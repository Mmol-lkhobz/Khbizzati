<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>مول الخبز - إدارة وتوزيع ذكي</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Tahoma', 'Arial', sans-serif;
            background: linear-gradient(135deg, #1a472a, #2d6a4f);
            min-height: 100vh;
            padding: 15px;
        }
        .app-container {
            max-width: 450px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .header {
            background: #2d6a4f;
            color: white;
            padding: 20px;
            text-align: center;
        }
        .header h1 { font-size: 22px; margin-bottom: 5px; }
        .header p { font-size: 12px; opacity: 0.8; }

        /* أزرار التصدير والاستيراد */
        .data-buttons {
            display: flex;
            gap: 10px;
            margin: 15px 15px 0 15px;
        }
        .data-btn {
            flex: 1;
            background: #1e6091;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
        }
        .import-btn { background: #2d6a4f; }
        .schedule-btn {
            background: #e67e22;
            color: white;
            border: none;
            padding: 12px;
            margin: 15px 15px 0 15px;
            width: calc(100% - 30px);
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
        }
        .modal-content {
            background: white;
            max-width: 450px;
            width: 100%;
            max-height: 90%;
            overflow-y: auto;
            border-radius: 20px;
            padding: 20px;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #2d6a4f;
        }
        .modal-header h3 { color: #2d6a4f; }
        .close-modal {
            background: #e63946;
            color: white;
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
        }
        .schedule-form {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 20px;
        }
        .schedule-form input, .schedule-form select {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
        }
        .schedule-form button {
            background: #2d6a4f;
            color: white;
            border: none;
            padding: 10px;
            width: 100%;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        .schedule-item {
            background: #e9ecef;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        .schedule-info { flex: 1; }
        .schedule-name { font-weight: bold; color: #2d6a4f; font-size: 16px; }
        .schedule-details { font-size: 13px; color: #555; }
        .schedule-actions button {
            background: #e63946;
            color: white;
            border: none;
            padding: 5px 12px;
            border-radius: 8px;
            cursor: pointer;
        }
        .clear-schedule-btn {
            background: #e67e22;
            color: white;
            border: none;
            padding: 10px;
            width: 100%;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 15px;
            font-weight: bold;
        }
        .phone-banner {
            background: #f4a261;
            color: #1a472a;
            text-align: center;
            padding: 12px;
            margin: 15px 15px 0 15px;
            border-radius: 15px;
            font-size: 18px;
            font-weight: bold;
        }
        .phone-banner span {
            font-size: 22px;
            background: white;
            padding: 4px 12px;
            border-radius: 30px;
            display: inline-block;
            margin-top: 5px;
        }
        .total-card {
            background: #f4a261;
            color: white;
            text-align: center;
            padding: 20px;
            margin: 15px;
            border-radius: 15px;
        }
        .total-card h3 { font-size: 16px; margin-bottom: 8px; font-weight: normal; }
        .total-card .total-value { font-size: 42px; font-weight: bold; }
        .add-section {
            background: #f8f9fa;
            margin: 15px;
            padding: 15px;
            border-radius: 15px;
        }
        .add-section h4 { color: #2d6a4f; margin-bottom: 12px; font-size: 16px; }
        .input-row { display: flex; gap: 10px; }
        .input-row input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 14px;
        }
        .input-row button {
            background: #2d6a4f;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }
        .search-section {
            background: #f8f9fa;
            margin: 15px;
            padding: 15px;
            border-radius: 15px;
        }
        .search-section h4 { color: #2d6a4f; margin-bottom: 12px; font-size: 16px; }
        .search-section input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 14px;
        }
        .customers-list { margin: 15px; max-height: 400px; overflow-y: auto; }
        .customer-card {
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 12px;
        }
        .customer-card.hidden { display: none; }
        .customer-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .customer-name { font-size: 18px; font-weight: bold; color: #2d6a4f; }
        .customer-total {
            background: #e9ecef;
            padding: 5px 12px;
            border-radius: 20px;
            font-weight: bold;
            color: #2d6a4f;
        }
        .payment-row { display: flex; gap: 10px; margin-bottom: 12px; }
        .payment-row input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 10px;
            text-align: center;
        }
        .payment-row button {
            background: #f4a261;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
        }
        .payments-log {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 10px;
            margin-bottom: 12px;
            max-height: 120px;
            overflow-y: auto;
        }
        .payment-log-item {
            display: flex;
            justify-content: space-between;
            padding: 6px 8px;
            border-bottom: 1px solid #e9ecef;
            font-size: 13px;
        }
        .payment-log-item .time { color: #6c757d; }
        .payment-log-item .amount { font-weight: bold; color: #2d6a4f; }
        .empty-log { text-align: center; color: #adb5bd; font-size: 12px; padding: 8px; }
        .customer-buttons { display: flex; gap: 10px; }
        .delete-customer-btn {
            flex: 1;
            background: #e63946;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
        }
        .copy-link-btn {
            flex: 1;
            background: #1e6091;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
        }
        .day-buttons { display: flex; gap: 10px; margin: 15px; }
        .new-day-btn {
            background: #e63946;
            color: white;
            border: none;
            padding: 15px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            flex: 1;
        }
        .footer {
            background: #1a472a;
            color: white;
            text-align: center;
            padding: 15px;
            font-size: 12px;
        }
        .footer .phone { font-size: 16px; font-weight: bold; margin-top: 5px; }
        .alert {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #2d6a4f;
            color: white;
            padding: 12px 24px;
            border-radius: 30px;
            z-index: 1000;
            font-size: 14px;
            animation: slideDown 0.3s ease;
        }
        @keyframes slideDown {
            from { top: -50px; opacity: 0; }
            to { top: 20px; opacity: 1; }
        }
        .hidden-input { display: none; }
    </style>
</head>
<body>
    <div id="mainApp"></div>
    <input type="file" id="importFileInput" accept=".json" style="display:none;">
    <script>
        (function(){
            // ==================== البيانات الأساسية ====================
            let customers = [];
            let dailySchedule = [];

            // ==================== دوال مساعدة ====================
            function showAlert(msg) {
                let div = document.createElement('div');
                div.className = 'alert';
                div.textContent = msg;
                document.body.appendChild(div);
                setTimeout(() => div.remove(), 2500);
            }
            function escapeHtml(t) {
                let d = document.createElement('div');
                d.textContent = t;
                return d.innerHTML;
            }
            function getBaseUrl() {
                let path = window.location.pathname;
                let base = window.location.origin + path.substring(0, path.lastIndexOf('/')+1);
                return base;
            }

            // ==================== حفظ وتحميل البيانات ====================
            function saveData() { localStorage.setItem('moulBreadData', JSON.stringify(customers)); }
            function loadData() {
                let saved = localStorage.getItem('moulBreadData');
                if(saved) { try{ customers = JSON.parse(saved); } catch(e){ customers = []; } }
            }
            function saveSchedule() { localStorage.setItem('dailySchedule', JSON.stringify(dailySchedule)); }
            function loadSchedule() {
                let saved = localStorage.getItem('dailySchedule');
                if(saved) { try{ dailySchedule = JSON.parse(saved); } catch(e){ dailySchedule = []; } }
            }

            // ==================== التصدير والاستيراد ====================
            function exportData() {
                let fullData = {
                    customers: customers,
                    dailySchedule: dailySchedule,
                    exportDate: new Date().toISOString()
                };
                let dataStr = JSON.stringify(fullData, null, 2);
                let blob = new Blob([dataStr], {type: 'application/json'});
                let url = URL.createObjectURL(blob);
                let a = document.createElement('a');
                a.href = url;
                a.download = `moul_khobz_backup_${new Date().toISOString().slice(0,19).replace(/:/g, '-')}.json`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                showAlert('📁 تم تصدير البيانات بنجاح');
            }

            function importData() {
                let input = document.getElementById('importFileInput');
                if(!input) return;
                input.onchange = function(e) {
                    let file = e.target.files[0];
                    if(!file) return;
                    let reader = new FileReader();
                    reader.onload = function(evt) {
                        try {
                            let imported = JSON.parse(evt.target.result);
                            if(imported.customers) customers = imported.customers;
                            if(imported.dailySchedule) dailySchedule = imported.dailySchedule;
                            saveData();
                            saveSchedule();
                            updateDisplay();
                            showAlert('✅ تم استيراد البيانات بنجاح');
                        } catch(err) {
                            showAlert('❌ فشل الاستيراد: الملف غير صالح');
                        }
                        input.value = '';
                    };
                    reader.readAsText(file);
                };
                input.click();
            }

            // ==================== البرنامج اليومي ====================
            function showScheduleModal() {
                let existing = document.getElementById('scheduleModal');
                if(existing) existing.remove();
                let scheduleHtml = dailySchedule.length === 0 ? '<div style="text-align:center;padding:20px;color:#adb5bd;">📋 لا توجد مواعيد مضافة</div>' :
                    dailySchedule.map(s => `<div class="schedule-item"><div class="schedule-info"><div class="schedule-name">${escapeHtml(s.name)}</div><div class="schedule-details">🍞 ${s.amount} وحدة | ⏰ ${s.time}</div></div><div class="schedule-actions"><button onclick="window.deleteFromSchedule(${s.id})">🗑️</button></div></div>`).join('');
                let modal = document.createElement('div');
                modal.id = 'scheduleModal';
                modal.className = 'modal';
                modal.innerHTML = `<div class="modal-content"><div class="modal-header"><h3>📋 البرنامج اليومي</h3><button class="close-modal" onclick="this.closest('.modal').remove()">✖</button></div>
                    <div class="schedule-form"><input type="text" id="scheduleName" placeholder="اسم الزبون"><input type="number" id="scheduleAmount" placeholder="عدد الخبز اليومي"><input type="time" id="scheduleTime" placeholder="الساعة">
                    <button onclick="window.addToSchedule()">➕ إضافة موعد</button></div>
                    <div id="scheduleList">${scheduleHtml}</div>
                    <button class="clear-schedule-btn" onclick="window.clearAllSchedule()">🗑️ مسح البرنامج اليومي بالكامل</button></div>`;
                document.body.appendChild(modal);
            }
            function addToSchedule() {
                let name = document.getElementById('scheduleName')?.value.trim();
                let amount = document.getElementById('scheduleAmount')?.value;
                let time = document.getElementById('scheduleTime')?.value;
                if(!name) { showAlert('الرجاء إدخال اسم الزبون'); return; }
                if(!amount || amount<=0) { showAlert('الرجاء إدخال عدد صحيح'); return; }
                if(!time) { showAlert('الرجاء إدخال الساعة'); return; }
                dailySchedule.push({ id: Date.now(), name: name, amount: parseInt(amount), time: time });
                saveSchedule();
                showScheduleModal();
                showAlert(`✅ تم إضافة ${name}`);
            }
            function deleteFromSchedule(id) {
                dailySchedule = dailySchedule.filter(s => s.id != id);
                saveSchedule();
                showScheduleModal();
                showAlert('🗑️ تم الحذف');
            }
            function clearAllSchedule() {
                if(dailySchedule.length===0) { showAlert('لا توجد بيانات'); return; }
                if(confirm('⚠️ مسح كل البرنامج اليومي؟')) { dailySchedule = []; saveSchedule(); showScheduleModal(); showAlert('✅ تم المسح'); }
            }
            function requestNotifPermission() {
                if(!("Notification" in window)) { showAlert("المتصفح لا يدعم الإشعارات"); return; }
                Notification.requestPermission().then(perm => { if(perm==='granted') showAlert("🔔 تم تفعيل الإشعارات"); });
            }
            function checkReminders() {
                let now = new Date();
                let currentHour = now.getHours();
                let currentMinute = now.getMinutes();
                dailySchedule.forEach(item => {
                    let [schHour, schMinute] = item.time.split(':').map(Number);
                    let diff = (schHour*60+schMinute) - (currentHour*60+currentMinute);
                    if(diff>=0 && diff<=5) {
                        let lastNotif = localStorage.getItem(`reminder_${item.id}_${now.toDateString()}`);
                        if(!lastNotif) {
                            localStorage.setItem(`reminder_${item.id}_${now.toDateString()}`, 'sent');
                            if(Notification.permission==='granted') new Notification(`🔔 تذكير: ${item.name}`, { body: `${item.amount} وحدة - ${item.time}` });
                            showAlert(`🔔 تذكير: ${item.name} - ${item.amount} وحدة الساعة ${item.time}`);
                        }
                    }
                });
            }

            // ==================== دوال الإدارة (للمالك فقط) ====================
            function addCustomer() {
                let input = document.getElementById('customerName');
                let name = input.value.trim();
                if(!name) { showAlert('الرجاء إدخال اسم الزبون'); return; }
                if(customers.some(c=>c.name===name)) { showAlert('الزبون موجود بالفعل'); return; }
                customers.push({ id: Date.now(), name: name, payments: [] });
                input.value = '';
                saveData();
                updateDisplay();
                showAlert(`تم إضافة ${name} ✅`);
            }
            function addPayment(cid) {
                let input = document.querySelector(`[data-payment-input="${cid}"]`);
                if(!input) return;
                let amount = parseInt(input.value);
                if(!amount || amount<=0) { showAlert('أدخل عدد الوحدات'); return; }
                let cust = customers.find(c=>c.id==cid);
                if(!cust) return;
                let now = new Date();
                let timeStr = `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;
                cust.payments.push({ amount: amount, time: timeStr });
                input.value = '';
                saveData();
                updateDisplay();
                showAlert(`تم إضافة ${amount} وحدة ✅`);
            }
            function deleteCustomer(cid) {
                let cust = customers.find(c=>c.id==cid);
                if(!cust) return;
                if(confirm(`حذف ${cust.name}؟`)) {
                    customers = customers.filter(c=>c.id!=cid);
                    saveData();
                    updateDisplay();
                    showAlert(`تم حذف ${cust.name} 🗑️`);
                }
            }
            function copyLink(cid, name) {
                let link = getBaseUrl() + '?customer=' + encodeURIComponent(name);
                navigator.clipboard.writeText(link).then(()=>showAlert(`📋 تم نسخ رابط ${name}`)).catch(()=>showAlert('فشل النسخ'));
            }
            function startNewDay() {
                if(customers.length===0) { showAlert('لا توجد بيانات'); return; }
                let total = customers.reduce((s,c)=>s+c.payments.reduce((s2,p)=>s2+p.amount,0),0);
                if(confirm(`المجموع: ${total} وحدة\n${customers.length} زبون\nبدء يوم جديد؟`)) {
                    customers = [];
                    saveData();
                    updateDisplay();
                    showAlert('تم بدء يوم جديد 🎉');
                }
            }
            function searchCustomers() {
                let inp = document.getElementById('searchInput');
                if(!inp) return;
                let txt = inp.value.trim().toLowerCase();
                document.querySelectorAll('.customer-card').forEach(card=>{
                    let name = card.querySelector('.customer-name')?.textContent.toLowerCase()||'';
                    if(txt==='' || name.includes(txt)) card.classList.remove('hidden');
                    else card.classList.add('hidden');
                });
            }

            // ==================== صفحة الزبون (بدون زر رجوع) ====================
            function showCustomerView(customerName) {
                let customer = customers.find(c => c.name === customerName);
                if (!customer) {
                    return `<!DOCTYPE html>
                    <html lang="ar" dir="rtl">
                    <head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>الزبون غير موجود</title>
                    <style>body{font-family:'Tahoma';background:#1a472a;padding:20px;text-align:center;} .card{background:white;max-width:400px;margin:0 auto;border-radius:20px;padding:40px;} button{background:#2d6a4f;color:white;border:none;padding:12px 20px;border-radius:10px;margin-top:20px;}</style>
                    </head><body><div class="card"><h2>⚠️ لا يوجد زبون بهذا الاسم</h2><p>الرجاء التأكد من الرابط أو التواصل مع المدير</p></div></body></html>`;
                }
                let customerTotal = customer.payments.reduce((s, p) => s + p.amount, 0);
                let paymentsHtml = '';
                if (customer.payments.length > 0) {
                    let reversed = [...customer.payments].reverse();
                    for (let p of reversed) {
                        paymentsHtml += `<div class="payment-log-item"><span class="time">⏰ ${p.time}</span><span class="amount">🍞 ${p.amount} وحدة</span></div>`;
                    }
                } else {
                    paymentsHtml = '<div class="empty-log" style="text-align:center;padding:20px;color:#adb5bd;">لا توجد طلبات بعد</div>';
                }
                return `<!DOCTYPE html>
                <html lang="ar" dir="rtl">
                <head>
                    <meta charset="UTF-8">
                    <meta name="viewport" content="width=device-width, initial-scale=1.0">
                    <title>سجل ${escapeHtml(customer.name)}</title>
                    <style>
                        *{margin:0;padding:0;box-sizing:border-box;}
                        body{font-family:'Tahoma','Arial',sans-serif;background:linear-gradient(135deg,#1a472a,#2d6a4f);min-height:100vh;padding:15px;}
                        .customer-view-page{max-width:450px;margin:0 auto;background:white;border-radius:20px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,0.2);}
                        .header{background:#2d6a4f;color:white;padding:20px;text-align:center;}
                        .header h1{font-size:22px;margin-bottom:5px;}
                        .header p{font-size:12px;opacity:0.8;}
                        .customer-view-card{background:white;margin:15px;padding:20px;border-radius:15px;text-align:center;}
                        .customer-view-name{font-size:28px;color:#2d6a4f;margin-bottom:20px;}
                        .customer-view-total{background:#f4a261;color:white;padding:15px;border-radius:15px;margin-bottom:20px;}
                        .customer-view-total span{font-size:36px;font-weight:bold;}
                        .payments-log{background:#f8f9fa;border-radius:10px;padding:10px;margin-bottom:20px;max-height:300px;overflow-y:auto;}
                        .payment-log-item{display:flex;justify-content:space-between;padding:6px 8px;border-bottom:1px solid #e9ecef;font-size:13px;}
                        .payment-log-item .time{color:#6c757d;}
                        .payment-log-item .amount{font-weight:bold;color:#2d6a4f;}
                        .empty-log{text-align:center;color:#adb5bd;font-size:12px;padding:8px;}
                        .footer{background:#1a472a;color:white;text-align:center;padding:15px;font-size:12px;}
                        .footer .phone{font-size:16px;font-weight:bold;margin-top:5px;}
                    </style>
                </head>
                <body>
                    <div class="customer-view-page">
                        <div class="header">
                            <h1>🍞 مول الخبز</h1>
                            <p>سجل الخبز الخاص بك</p>
                        </div>
                        <div class="customer-view-card">
                            <div class="customer-view-name">${escapeHtml(customer.name)}</div>
                            <div class="customer-view-total">
                                <div>📊 إجمالي الوحدات</div>
                                <span>${customerTotal}</span>
                                <div>وحدة</div>
                            </div>
                            <div class="payments-log">
                                ${paymentsHtml}
                            </div>
                        </div>
                        <div class="footer">
                            📞 للتواصل من أجل الإعلانات
                            <div class="phone">0605062609</div>
                        </div>
                    </div>
                </body>
                </html>`;
            }

            // ==================== عرض واجهة الإدارة (للمالك فقط) ====================
            function updateDisplay() {
                let total = customers.reduce((s,c)=>s+c.payments.reduce((s2,p)=>s2+p.amount,0),0);
                let totalEl = document.getElementById('totalBread');
                if(totalEl) totalEl.textContent = total;
                let container = document.getElementById('customersList');
                if(!container) return;
                if(customers.length===0) {
                    container.innerHTML = '<div style="text-align:center;padding:40px;color:#adb5bd;">👥 لا يوجد زبناء<br><span style="font-size:12px;">أضف زبونك الأول</span></div>';
                    return;
                }
                let html = '';
                for(let c of customers) {
                    let custTotal = c.payments.reduce((s,p)=>s+p.amount,0);
                    let logs = '';
                    if(c.payments.length) {
                        let rev = [...c.payments].reverse();
                        for(let p of rev) logs += `<div class="payment-log-item"><span class="time">⏰ ${p.time}</span><span class="amount">🍞 ${p.amount} وحدة</span></div>`;
                    } else { logs = '<div class="empty-log">لا توجد طلبات بعد</div>'; }
                    html += `<div class="customer-card">
                        <div class="customer-row"><span class="customer-name">${escapeHtml(c.name)}</span><span class="customer-total">${custTotal} وحدة</span></div>
                        <div class="payment-row"><input type="number" data-payment-input="${c.id}" placeholder="عدد الوحدات" onkeypress="if(event.key=='Enter') addPayment(${c.id})"><button onclick="addPayment(${c.id})">➕ إضافة</button></div>
                        <div class="payments-log">${logs}</div>
                        <div class="customer-buttons"><button class="copy-link-btn" onclick="copyLink(${c.id},'${escapeHtml(c.name).replace(/'/g,"\\'")}')">📋 نسخ الرابط</button><button class="delete-customer-btn" onclick="deleteCustomer(${c.id})">🗑️ حذف الزبون</button></div>
                    </div>`;
                }
                container.innerHTML = html;
                searchCustomers();
            }

            function showMainApp() {
                let html = `<div class="app-container">
                    <div class="header"><h1>🍞 مول الخبز</h1><p>تطبيق إدارة وتوزيع الخبز الذكي</p></div>
                    <div class="data-buttons">
                        <button class="data-btn" onclick="exportData()">📤 تصدير البيانات</button>
                        <button class="data-btn import-btn" onclick="importData()">📥 استيراد بيانات</button>
                    </div>
                    <button class="schedule-btn" onclick="requestNotifPermission(); showScheduleModal();">📋 البرنامج اليومي (مواعيد ثابتة)</button>
                    <div class="phone-banner">📞 عبدالرزاق<span>0605062609</span></div>
                    <div class="total-card"><h3>📊 إجمالي الوحدات الموزعة اليوم</h3><div class="total-value" id="totalBread">0</div><p style="font-size:12px;margin-top:5px;">وحدة</p></div>
                    <div class="add-section"><h4>➕ إضافة زبون جديد</h4><div class="input-row"><input type="text" id="customerName" placeholder="اسم الزبون"><button id="addCustomerBtn">إضافة</button></div></div>
                    <div class="search-section"><h4>🔍 بحث عن زبون</h4><input type="text" id="searchInput" placeholder="اكتب اسم الزبون..." onkeyup="searchCustomers()"></div>
                    <div class="customers-list" id="customersList"></div>
                    <div class="day-buttons"><button class="new-day-btn" id="newDayBtn">🔄 بدء يوم جديد (مسح التوزيع فقط)</button></div>
                    <div class="footer">📞 للتواصل من أجل الإعلانات<div class="phone">0605062609</div></div>
                </div>`;
                document.getElementById('mainApp').innerHTML = html;
                document.getElementById('addCustomerBtn').onclick = addCustomer;
                document.getElementById('customerName').onkeypress = e => { if(e.key==='Enter') addCustomer(); };
                document.getElementById('newDayBtn').onclick = startNewDay;
                updateDisplay();
            }

            // ==================== ربط الدوال للنافذة ====================
            window.addPayment = addPayment;
            window.deleteCustomer = deleteCustomer;
            window.copyLink = copyLink;
            window.searchCustomers = searchCustomers;
            window.showScheduleModal = showScheduleModal;
            window.addToSchedule = addToSchedule;
            window.deleteFromSchedule = deleteFromSchedule;
            window.clearAllSchedule = clearAllSchedule;
            window.requestNotifPermission = requestNotifPermission;
            window.showAlert = showAlert;
            window.exportData = exportData;
            window.importData = importData;

            // ==================== بدء التشغيل ====================
            loadData();
            loadSchedule();
            setInterval(checkReminders, 60000);
            checkReminders();
            let urlParams = new URLSearchParams(window.location.search);
            let customerParam = urlParams.get('customer');
            if(customerParam) {
                document.write(showCustomerView(customerParam));
                document.close();
            } else {
                showMainApp();
            }
        })();
    </script>
</body>
</html>
