<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق إدارة وتوزيع الخبز الذكي</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Tahoma', 'Arial', sans-serif;
            background: linear-gradient(135deg, #1a472a, #2d6a4f);
            min-height: 100vh;
            padding: 15px;
        }

        .app-container {
            max-width: 450px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        /* رأس التطبيق */
        .header {
            background: #2d6a4f;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 22px;
            margin-bottom: 5px;
        }

        .header p {
            font-size: 12px;
            opacity: 0.8;
        }

        /* رقم الهاتف الكبير */
        .phone-banner {
            background: #f4a261;
            color: #1a472a;
            text-align: center;
            padding: 12px;
            margin: 15px 15px 0 15px;
            border-radius: 15px;
            font-size: 18px;
            font-weight: bold;
        }

        .phone-banner span {
            font-size: 22px;
            background: white;
            padding: 4px 12px;
            border-radius: 30px;
            display: inline-block;
            margin-top: 5px;
        }

        /* بطاقة المجموع */
        .total-card {
            background: #f4a261;
            color: white;
            text-align: center;
            padding: 20px;
            margin: 15px;
            border-radius: 15px;
        }

        .total-card h3 {
            font-size: 16px;
            margin-bottom: 8px;
            font-weight: normal;
        }

        .total-card .total-value {
            font-size: 42px;
            font-weight: bold;
        }

        /* قسم إضافة زبون */
        .add-section {
            background: #f8f9fa;
            margin: 15px;
            padding: 15px;
            border-radius: 15px;
        }

        .add-section h4 {
            color: #2d6a4f;
            margin-bottom: 12px;
            font-size: 16px;
        }

        .input-row {
            display: flex;
            gap: 10px;
        }

        .input-row input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 14px;
            font-family: inherit;
        }

        .input-row button {
            background: #2d6a4f;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }

        /* خانة البحث */
        .search-section {
            background: #f8f9fa;
            margin: 15px;
            padding: 15px;
            border-radius: 15px;
        }

        .search-section h4 {
            color: #2d6a4f;
            margin-bottom: 12px;
            font-size: 16px;
        }

        .search-section input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 14px;
            font-family: inherit;
        }

        /* قائمة الزبناء */
        .customers-list {
            margin: 15px;
            max-height: 400px;
            overflow-y: auto;
        }

        .customer-card {
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 12px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .customer-card.hidden {
            display: none;
        }

        .customer-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .customer-name {
            font-size: 18px;
            font-weight: bold;
            color: #2d6a4f;
        }

        .customer-total {
            background: #e9ecef;
            padding: 5px 12px;
            border-radius: 20px;
            font-weight: bold;
            color: #2d6a4f;
        }

        /* إضافة وحدات */
        .payment-row {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
        }

        .payment-row input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 14px;
            text-align: center;
        }

        .payment-row button {
            background: #f4a261;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
        }

        /* سجل الدفعات مع الوقت */
        .payments-log {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 10px;
            margin-bottom: 12px;
            max-height: 120px;
            overflow-y: auto;
        }

        .payment-log-item {
            display: flex;
            justify-content: space-between;
            padding: 6px 8px;
            border-bottom: 1px solid #e9ecef;
            font-size: 13px;
        }

        .payment-log-item .time {
            color: #6c757d;
        }

        .payment-log-item .amount {
            font-weight: bold;
            color: #2d6a4f;
        }

        .empty-log {
            text-align: center;
            color: #adb5bd;
            font-size: 12px;
            padding: 8px;
        }

        /* أزرار العميل */
        .customer-buttons {
            display: flex;
            gap: 10px;
        }

        .delete-customer-btn {
            flex: 1;
            background: #e63946;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
        }

        .copy-link-btn {
            flex: 1;
            background: #1e6091;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
        }

        /* زر بدء يوم جديد */
        .new-day-btn {
            background: #e63946;
            color: white;
            border: none;
            padding: 15px;
            width: calc(100% - 30px);
            margin: 15px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        /* تذييل */
        .footer {
            background: #1a472a;
            color: white;
            text-align: center;
            padding: 15px;
            font-size: 12px;
        }

        .footer .phone {
            font-size: 16px;
            font-weight: bold;
            margin-top: 5px;
        }

        /* تنبيهات */
        .alert {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #2d6a4f;
            color: white;
            padding: 12px 24px;
            border-radius: 30px;
            z-index: 1000;
            font-size: 14px;
            animation: slideDown 0.3s ease;
            box-shadow: 0 3px 10px rgba(0,0,0,0.2);
        }

        @keyframes slideDown {
            from { top: -50px; opacity: 0; }
            to { top: 20px; opacity: 1; }
        }

        /* صفحة الزبون (view mode) */
        .customer-view-container {
            max-width: 450px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .back-home {
            display: block;
            background: #2d6a4f;
            color: white;
            text-align: center;
            padding: 12px;
            text-decoration: none;
            margin: 15px;
            border-radius: 10px;
            font-weight: bold;
        }

        .customer-view-card {
            background: white;
            margin: 15px;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
        }

        .customer-view-name {
            font-size: 28px;
            color: #2d6a4f;
            margin-bottom: 20px;
        }

        .customer-view-total {
            background: #f4a261;
            color: white;
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 20px;
        }

        .customer-view-total span {
            font-size: 36px;
            font-weight: bold;
        }

        /* سكرول */
        .customers-list::-webkit-scrollbar,
        .payments-log::-webkit-scrollbar {
            width: 3px;
        }

        .customers-list::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }

        .customers-list::-webkit-scrollbar-thumb {
            background: #2d6a4f;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div id="mainApp"></div>

    <script>
        // بيانات الزبناء
        let customers = [];

        // الحصول على رابط التطبيق الأساسي
        function getBaseUrl() {
            return window.location.origin + window.location.pathname;
        }

        // نسخ الرابط
        async function copyCustomerLink(customerId, customerName) {
            const baseUrl = getBaseUrl();
            const link = `${baseUrl}?customer=${encodeURIComponent(customerName)}`;
            
            try {
                await navigator.clipboard.writeText(link);
                showAlert(`📋 تم نسخ رابط ${customerName}`);
            } catch(err) {
                showAlert('فشل النسخ، حاول يدوياً');
            }
        }

        // تحميل البيانات من localStorage
        function loadData() {
            try {
                const saved = localStorage.getItem('moulBreadData');
                if (saved) {
                    customers = JSON.parse(saved);
                }
            } catch(e) {
                customers = [];
            }
        }

        // حفظ البيانات
        function saveData() {
            localStorage.setItem('moulBreadData', JSON.stringify(customers));
        }

        // إضافة زبون جديد
        function addCustomer() {
            const input = document.getElementById('customerName');
            const name = input.value.trim();

            if (!name) {
                showAlert('الرجاء إدخال اسم الزبون');
                return;
            }

            if (customers.some(c => c.name === name)) {
                showAlert('هذا الزبون موجود بالفعل');
                return;
            }

            customers.push({
                id: Date.now(),
                name: name,
                payments: []
            });

            input.value = '';
            input.focus();
            saveData();
            updateDisplay();
            showAlert(`تم إضافة ${name} ✅`);
        }

        // إضافة وحدات لزبون
        function addPayment(customerId) {
            const input = document.querySelector(`[data-payment-input="${customerId}"]`);
            if (!input) return;

            const amount = parseInt(input.value);
            if (!amount || amount <= 0) {
                showAlert('أدخل عدد الوحدات (رقم صحيح)');
                return;
            }

            const customer = customers.find(c => c.id == customerId);
            if (!customer) return;

            const now = new Date();
            const timeString = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;

            customer.payments.push({
                amount: amount,
                time: timeString
            });

            input.value = '';
            saveData();
            updateDisplay();
            showAlert(`تم إضافة ${amount} وحدة ✅`);
        }

        // حذف زبون
        function deleteCustomer(customerId) {
            const customer = customers.find(c => c.id == customerId);
            if (!customer) return;

            if (confirm(`هل تريد حذف ${customer.name}؟`)) {
                customers = customers.filter(c => c.id != customerId);
                saveData();
                updateDisplay();
                showAlert(`تم حذف ${customer.name} 🗑️`);
            }
        }

        // بدء يوم جديد
        function startNewDay() {
            if (customers.length === 0) {
                showAlert('لا توجد بيانات لحذفها');
                return;
            }

            const total = customers.reduce((sum, c) => sum + c.payments.reduce((s, p) => s + p.amount, 0), 0);
            const count = customers.length;

            if (confirm(`📊 إحصائيات اليوم:\nالمجموع: ${total} وحدة\nعدد الزبناء: ${count}\n\n⚠️ هل تريد بدء يوم جديد؟ سيتم مسح كل البيانات.`)) {
                customers = [];
                saveData();
                updateDisplay();
                showAlert('تم بدء يوم جديد 🎉');
            }
        }

        // البحث عن زبون
        function searchCustomers() {
            const searchInput = document.getElementById('searchInput');
            const searchText = searchInput.value.trim().toLowerCase();
            
            const customerCards = document.querySelectorAll('.customer-card');
            
            customerCards.forEach(card => {
                const nameElement = card.querySelector('.customer-name');
                if (nameElement) {
                    const name = nameElement.textContent.toLowerCase();
                    if (searchText === '' || name.includes(searchText)) {
                        card.classList.remove('hidden');
                    } else {
                        card.classList.add('hidden');
                    }
                }
            });
        }

        // عرض صفحة الزبون
        function showCustomerView(customerName) {
            const customer = customers.find(c => c.name === customerName);
            
            if (!customer) {
                return `<div class="customer-view-container">
                    <div style="text-align: center; padding: 50px;">
                        <h2>⚠️ لا يوجد زبون بهذا الاسم</h2>
                        <a href="${getBaseUrl()}" class="back-home">العودة للصفحة الرئيسية</a>
                    </div>
                </div>`;
            }

            const customerTotal = customer.payments.reduce((s, p) => s + p.amount, 0);
            
            let paymentsHtml = '';
            if (customer.payments.length > 0) {
                const reversedPayments = [...customer.payments].reverse();
                paymentsHtml = reversedPayments.map(p => `
                    <div class="payment-log-item">
                        <span class="time">⏰ ${p.time}</span>
                        <span class="amount">🍞 ${p.amount} وحدة</span>
                    </div>
                `).join('');
            } else {
                paymentsHtml = '<div class="empty-log">لا توجد طلبات بعد</div>';
            }

            return `
                <div class="customer-view-container">
                    <div class="header">
                        <h1>🍞 مول الخبز</h1>
                        <p>سجل الخبز الخاص بك</p>
                    </div>
                    
                    <div class="customer-view-card">
                        <div class="customer-view-name">${escapeHtml(customer.name)}</div>
                        <div class="customer-view-total">
                            <div>📊 إجمالي الوحدات</div>
                            <span>${customerTotal}</span>
                            <div>وحدة</div>
                        </div>
                        
                        <div class="payments-log" style="max-height: 300px;">
                            ${paymentsHtml}
                        </div>
                    </div>
                    
                    <a href="${getBaseUrl()}" class="back-home">🏠 العودة للصفحة الرئيسية</a>
                    
                    <div class="footer">
                        📞 للتواصل من أجل الإعلانات
                        <div class="phone">0605062609</div>
                    </div>
                </div>
            `;
        }

        // تحديث واجهة المستخدم الرئيسية
        function updateDisplay() {
            const total = customers.reduce((sum, c) => sum + c.payments.reduce((s, p) => s + p.amount, 0), 0);
            
            const container = document.getElementById('customersList');
            if (!container) return;
            
            const totalElement = document.getElementById('totalBread');
            if (totalElement) totalElement.textContent = total;

            if (customers.length === 0) {
                container.innerHTML = `<div style="text-align: center; padding: 40px; color: #adb5bd;">👥 لا يوجد زبناء<br><span style="font-size: 12px;">أضف زبونك الأول</span></div>`;
                return;
            }

            container.innerHTML = customers.map(customer => {
                const customerTotal = customer.payments.reduce((s, p) => s + p.amount, 0);

                let paymentsHtml = '';
                if (customer.payments.length > 0) {
                    const reversedPayments = [...customer.payments].reverse();
                    paymentsHtml = reversedPayments.map(p => `
                        <div class="payment-log-item">
                            <span class="time">⏰ ${p.time}</span>
                            <span class="amount">🍞 ${p.amount} وحدة</span>
                        </div>
                    `).join('');
                } else {
                    paymentsHtml = '<div class="empty-log">لا توجد طلبات بعد</div>';
                }

                return `
                    <div class="customer-card">
                        <div class="customer-row">
                            <span class="customer-name">${escapeHtml(customer.name)}</span>
                            <span class="customer-total">${customerTotal} وحدة</span>
                        </div>
                        
                        <div class="payment-row">
                            <input type="number" data-payment-input="${customer.id}" class="payment-input" placeholder="عدد الوحدات" onkeypress="if(event.key=='Enter')addPayment(${customer.id})">
                            <button onclick="addPayment(${customer.id})">➕ إضافة</button>
                        </div>
                        
                        <div class="payments-log">
                            ${paymentsHtml}
                        </div>
                        
                        <div class="customer-buttons">
                            <button class="copy-link-btn" onclick="copyCustomerLink(${customer.id}, '${escapeHtml(customer.name).replace(/'/g, "\\'")}')">📋 نسخ الرابط</button>
                            <button class="delete-customer-btn" onclick="deleteCustomer(${customer.id})">🗑️ حذف الزبون</button>
                        </div>
                    </div>
                `;
            }).join('');
            
            // إعادة تعيين قيمة البحث إذا كان موجوداً
            const searchInput = document.getElementById('searchInput');
            if (searchInput && searchInput.value) {
                searchCustomers();
            }
        }

        // حماية من حقن HTML
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // عرض تنبيه
        function showAlert(message) {
            const alert = document.createElement('div');
            alert.className = 'alert';
            alert.textContent = message;
            document.body.appendChild(alert);
            setTimeout(() => {
                alert.remove();
            }, 2500);
        }

        // عرض الصفحة الرئيسية
        function showMainApp() {
            const html = `
                <div class="app-container">
                    <div class="header">
                        <h1>🍞 مول الخبز</h1>
                        <p>تطبيق إدارة وتوزيع الخبز الذكي</p>
                    </div>
                    
                    <div class="phone-banner">
                        📞 عبدالرزاق
                        <span>0605062609</span>
                    </div>

                    <div class="total-card">
                        <h3>📊 إجمالي الوحدات الموزعة اليوم</h3>
                        <div class="total-value" id="totalBread">0</div>
                        <p style="font-size: 12px; margin-top: 5px;">وحدة</p>
                    </div>

                    <div class="add-section">
                        <h4>➕ إضافة زبون جديد</h4>
                        <div class="input-row">
                            <input type="text" id="customerName" placeholder="اسم الزبون">
                            <button id="addCustomerBtn">إضافة</button>
                        </div>
                    </div>
                    
                    <div class="search-section">
                        <h4>🔍 بحث عن زبون</h4>
                        <input type="text" id="searchInput" placeholder="اكتب اسم الزبون..." onkeyup="searchCustomers()">
                    </div>

                    <div class="customers-list" id="customersList"></div>

                    <button class="new-day-btn" id="newDayBtn">🔄 بدء يوم جديد</button>

                    <div class="footer">
                        📞 للتواصل من أجل الإعلانات
                        <div class="phone">0605062609</div>
                    </div>
                </div>
            `;
            
            document.getElementById('mainApp').innerHTML = html;
            
            document.getElementById('addCustomerBtn').addEventListener('click', addCustomer);
            document.getElementById('customerName').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') addCustomer();
            });
            document.getElementById('newDayBtn').addEventListener('click', startNewDay);
            
            updateDisplay();
        }

        // تهيئة التطبيق
        function init() {
            loadData();
            
            const urlParams = new URLSearchParams(window.location.search);
            const customerParam = urlParams.get('customer');
            
            if (customerParam) {
                document.getElementById('mainApp').innerHTML = showCustomerView(customerParam);
            } else {
                showMainApp();
            }
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
